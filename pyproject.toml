[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amf-ai"
version = "0.1.0"
description = "A defensive, modular security assessment framework"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
amf = "amf.cli:main"

[tool.setuptools.packages.find]
include = ["amf*"]
